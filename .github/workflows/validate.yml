name: Validate skills

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Anthropic's quick_validate.py from anthropics/skills, vendored at scripts/validate-skill.py
      # so a release elsewhere cannot turn an unrelated PR red. The wrapper adds the checks it
      # lacks, such as the skill name matching its directory. PyYAML is pinned for the same
      # reason ajv-cli is below.
      - name: Validate against the Agent Skills spec
        run: |
          pip install pyyaml==6.0.3
          ./scripts/validate-skills.sh

      # The spec validator does not check links. See the comment in the script for why that matters.
      - name: Check relative links
        run: ./scripts/check-links.sh

      # The repo is also an Agent Plugin (agent-plugins.org): plugin.json plus the skills/
      # directory. The schema URL is versioned and immutable, so fetching it live is stable;
      # ajv-cli is pinned for the same reason PyYAML is.
      - name: Validate against the Agent Plugins spec
        run: |
          curl -sfL https://agent-plugins.org/schemas/1.0.0/plugin.schema.json -o /tmp/plugin.schema.json
          npx -y ajv-cli@5 validate --spec=draft2020 -s /tmp/plugin.schema.json -d plugin.json
