name: Validate skills

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Anthropic's quick_validate.py from anthropics/skills, vendored at scripts/validate-skill.py
      # so a release elsewhere cannot turn an unrelated PR red. The wrapper adds the checks it
      # lacks, such as the skill name matching its directory. PyYAML is pinned for the same
      # reason ajv-cli is below.
      - name: Validate against the Agent Skills spec
        run: |
          pip install pyyaml==6.0.3
          ./scripts/validate-skills.sh

      # The spec validator does not check links. See the comment in the script for why that matters.
      - name: Check relative links
        run: ./scripts/check-links.sh

      # The repo is also an Agent Plugin (agent-plugins.org): plugin.json plus the skills/
      # directory. The schema URL is versioned, but the immutable cache header is a hint and not
      # a guarantee, so the checksum is what makes fetching it live safe. To bump it when the
      # schema changes, review the new file and replace the hash with its sha256. ajv-cli is
      # pinned to an exact version for the same reason PyYAML is.
      - name: Validate against the Agent Plugins spec
        run: |
          curl -sfL https://agent-plugins.org/schemas/1.0.0/plugin.schema.json -o /tmp/plugin.schema.json
          echo "0a4aad95ce337878ad38802ebf0daa3fde76abe3f65400c86bcbb1ec0b3ab883  /tmp/plugin.schema.json" | sha256sum -c -
          npx -y ajv-cli@5.0.0 validate --spec=draft2020 -s /tmp/plugin.schema.json -d plugin.json
